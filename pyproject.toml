[project]
name = "colruyt-mcp"
version = "0.1.0"
description = "MCP server (stdio) for Colruyt Xtra / Collect&Go — recipes, shopping list, cart (never checks out)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "playwright>=1.63.0",
    "pydantic>=2.14.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[project.scripts]
colruyt-mcp = "colruyt_mcp.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
